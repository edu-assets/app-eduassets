name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Resolve pinned docs commit
        id: docs-pin
        run: |
          sha="$(grep -oE 'docs-eduassets/[0-9a-f]{40}/public' src/core/docs/docsService.ts | head -n1 | cut -d/ -f2)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned docs
        uses: actions/checkout@v4
        with:
          repository: edu-assets/docs-eduassets
          ref: ${{ steps.docs-pin.outputs.sha }}
          fetch-depth: 0
          path: .docs-eduassets
          persist-credentials: false
      - name: Check docs registry dates against the pinned docs
        run: node scripts/sync-docs-registry.mjs --check --docs .docs-eduassets
      - name: Check local docs fallback matches the pinned docs
        run: diff -r --strip-trailing-cr public/docs .docs-eduassets/public/docs
      - name: Validate Cloudflare Pages security headers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const headers = fs.readFileSync('public/_headers', 'utf8');
          const csp = headers.match(/Content-Security-Policy:\s*(.+)/)?.[1] ?? '';
          if (!csp.includes("connect-src 'self' https://api.eduassets.tech")) {
            throw new Error('CSP does not allow the production API origin');
          }
          if (!csp.includes('https://static.cloudflareinsights.com')) {
            throw new Error('CSP does not allow the official Cloudflare Insights script');
          }
          const connectSrc = csp.match(/(?:^|;)\s*connect-src\s+([^;]+)/)?.[1] ?? '';
          for (const origin of ['https://docs.eduassets.tech', 'https://raw.githubusercontent.com']) {
            if (!connectSrc.split(/\s+/).includes(origin)) {
              throw new Error(`CSP connect-src does not allow the documentation origin: ${origin}`);
            }
          }
          // Google Analytics loads only after consent, from a bundled module (no inline scripts).
          const scriptSrc = csp.match(/(?:^|;)\s*script-src\s+([^;]+)/)?.[1] ?? '';
          if (!scriptSrc.split(/\s+/).includes('https://*.googletagmanager.com')) {
            throw new Error('CSP script-src does not allow the Google Analytics loader');
          }
          for (const origin of ['https://*.google-analytics.com', 'https://*.analytics.google.com']) {
            if (!connectSrc.split(/\s+/).includes(origin)) {
              throw new Error(`CSP connect-src does not allow Google Analytics: ${origin}`);
            }
          }
          if (/'unsafe-inline'/.test(scriptSrc)) {
            throw new Error("CSP script-src must not allow 'unsafe-inline'");
          }
          const docsSource = fs.readFileSync('src/core/docs/docsService.ts', 'utf8');
          if (!/https:\/\/raw\.githubusercontent\.com\/edu-assets\/docs-eduassets\/[0-9a-f]{40}\/public/.test(docsSource)) {
            throw new Error('The central Markdown source must be pinned to an immutable docs commit SHA');
          }
          NODE
